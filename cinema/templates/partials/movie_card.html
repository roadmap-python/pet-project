{% load static %}
<!-- Reusable Movie Card Component -->
<article onclick="window.location.href='{% url 'movie-detail' movie.id %}'" 
         class="group relative w-full h-[360px] md:h-[420px] rounded-2xl overflow-hidden bg-card border border-border/50 shadow-lg hover:shadow-glow transition-all duration-500 cursor-pointer transform hover:-translate-y-1">
    
    <!-- Movie Poster Image -->
    <img src="{% if 'http' in movie.poster_url.name %}{{ movie.poster_url.name }}{% else %}{{ movie.poster_url.url }}{% endif %}" 
         alt="{{ movie.title }}" 
         loading="lazy"
         class="absolute inset-0 w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-110">
    
    <!-- Permanent Dark Gradient for text legibility -->
    <div class="absolute inset-0 bg-gradient-to-t from-background via-background/60 to-transparent z-10"></div>
    
    <!-- Hover Glassmorphism Overlay -->
    <div class="absolute inset-0 bg-background/40 backdrop-blur-sm opacity-0 group-hover:opacity-100 transition-opacity duration-500 z-20 flex flex-col items-center justify-center gap-4 px-4">
        
        {% if is_coming_soon %}
            <!-- Actions for Coming Soon -->
            <a href="{% url 'movie-detail' movie.id %}" class="w-full max-w-[200px] bg-accent text-white py-3 rounded-xl font-semibold text-sm text-center hover:bg-danger transition-colors duration-300 shadow-glow-accent transform translate-y-4 group-hover:translate-y-0">
                <i class="fa-solid fa-bell mr-2"></i> Remind Me
            </a>
        {% else %}
            <!-- Actions for Now Showing -->
            <a href="{% url 'select-cinema' movie.id %}" class="w-full max-w-[200px] bg-primary text-background py-3 rounded-xl font-semibold text-sm text-center hover:bg-primaryHover transition-colors duration-300 shadow-glow transform translate-y-4 group-hover:translate-y-0 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-background">
                <i class="fa-solid fa-ticket mr-2"></i> Đặt Vé Ngay
            </a>
        {% endif %}
        
        <a href="{% url 'movie-detail' movie.id %}" class="w-full max-w-[200px] bg-card/80 text-white border border-border py-3 rounded-xl font-semibold text-sm text-center hover:bg-secondary hover:border-white/50 transition-all duration-300 transform translate-y-4 group-hover:translate-y-0 delay-75 focus:outline-none focus:ring-2 focus:ring-white">
            <i class="fa-solid fa-circle-info mr-2"></i> Chi Tiết Phim
        </a>
    </div>

    <!-- Top Badges -->
    <div class="absolute top-3 inset-x-3 flex justify-between items-start z-10 pointer-events-none">
        <div class="bg-card/80 backdrop-blur-md border border-border px-2.5 py-1 rounded-lg text-xs font-bold text-white shadow-sm flex items-center gap-1.5">
            <i class="fa-solid fa-star text-primary text-[10px]"></i> 
            {{ movie.rating|default:"8.5" }}
        </div>
        <div class="bg-danger/80 backdrop-blur-md border border-danger/30 px-2 py-1 rounded-lg text-xs font-bold text-white shadow-sm">
            {{ movie.age_restriction|default:"PG-13" }}
        </div>
    </div>

    <!-- Bottom Content Information -->
    <div class="absolute bottom-0 inset-x-0 p-5 z-10 transform transition-transform duration-500 group-hover:translate-y-2 group-hover:opacity-0 pointer-events-none">
        <h3 class="text-xl font-heading font-bold text-white mb-1.5 line-clamp-1 tracking-tight drop-shadow-md">
            {{ movie.title }}
        </h3>
        
        <div class="flex items-center gap-2 text-xs font-medium text-subtext/90 drop-shadow">
            <span class="truncate">{{ movie.genres.all|join:", "|default:"Action, Sci-Fi" }}</span>
            <span class="w-1 h-1 rounded-full bg-border"></span>
            <span class="whitespace-nowrap">{{ movie.duration }} min</span>
        </div>
    </div>
</article>
