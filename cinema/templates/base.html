<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Luxury Cinema{% endblock %}</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        gold: { 400: '#FBBF24', 500: '#F59E0B', 600: '#D97706' },
                        dark: { 800: '#1F2937', 900: '#111827', 950: '#030712' }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body class="bg-dark-950 text-gray-200 font-sans antialiased min-h-screen flex flex-col">
    
    <!-- Navbar -->
    <nav class="bg-dark-900 border-b border-gray-800 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-2">
                    <span class="text-2xl font-bold tracking-wider text-white">VIP<span class="text-gold-500">CINEMA</span></span>
                </div>
                <div class="flex space-x-4">
                    <a href="#" class="text-gold-400 px-3 py-2 text-sm font-medium">Phim Đang Chiếu</a>
                    <a href="#" class="text-gray-300 hover:text-gold-400 px-3 py-2 text-sm font-medium">Rạp Phim</a>
                    <a href="#" class="bg-gold-600 text-white px-4 py-2 rounded-md text-sm font-medium">Đăng Nhập</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow">
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-dark-900 border-t border-gray-800 mt-12 py-8 text-center text-gray-500 text-sm">
        &copy; 2026 VIP Cinema Enterprise.
    </footer>
</body>
</html>
